name: HW22 Playwright Tests

on:
  push:
    paths:
      - 'HW22/HW18/**'
      - '.github/workflows/hw22-playwright.yml'
  pull_request:
    paths:
      - 'HW22/HW18/**'
      - '.github/workflows/hw22-playwright.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: HW22/HW18

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'HW22/HW18/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: HW22/HW18/playwright-report/
          retention-days: 7
